<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Security policy for hosts that cannot send headers (S3 on Floci). Vercel also sends it as a header. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com http://localhost:3000 https://collection-manager-api.vercel.app http://*.execute-api.localhost.floci.io:4566; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="collection-api-origin" content="">
  <title>Wishlist | Collection Manager</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/wishlist.css">
  <!-- Integration: shared API address and login session, loaded before wishlist.js -->
  <script src="./js/config.js" defer></script>
  <script src="./js/api.js" defer></script>
  <script src="./js/wishlist.js" defer></script>
</head>
<body>
  <!-- Integration: the shared header and navigation used on every page -->
  <header id="app-header" class="app-header"></header>
  <main class="page wishlist-page">
    <div class="page-title">
      <div>
        <h1>Wishlist</h1>
        <p class="muted">Wanted items by priority and budget, plus a purchase planner.</p>
      </div>
      <button id="sign-out" class="secondary" hidden>Sign out</button>
    </div>
    <p id="notice" role="status" aria-live="polite" hidden></p>

    <section id="account" aria-labelledby="account-title">
      <h2 id="account-title">Sign in</h2>
      <form id="login">
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button>Sign in</button>
      </form>
      <details>
        <summary>Create an account</summary>
        <form id="register">
          <label>Name <input name="name" autocomplete="name" maxlength="150" required></label>
          <label>Email <input name="email" type="email" autocomplete="email" required></label>
          <label>Password <input name="password" type="password" autocomplete="new-password" required></label>
          <button>Register</button>
        </form>
      </details>
    </section>

    <div id="workspace" hidden>
      <section aria-labelledby="collection-title">
        <h2 id="collection-title">Collection</h2>
        <label>Choose a collection <select id="collections"></select></label>
        <p id="access"></p>
        <details>
          <summary>Create a collection</summary>
          <form id="new-collection">
            <label>Title <input name="title" maxlength="150" required></label>
            <label>Currency <input name="currency" value="EGP" pattern="[A-Za-z]{3}" maxlength="3" required></label>
            <button>Create collection</button>
          </form>
        </details>
      </section>

      <div id="collection-content" hidden>
        <section id="editor-panel" aria-labelledby="editor-title" hidden>
          <h2 id="editor-title">Add a wanted item</h2>
          <form id="editor">
            <label>Title <input name="title" maxlength="150" required></label>
            <label>Category <input name="category" maxlength="100" required></label>
            <label>Priority <select name="priority"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select></label>
            <label>Target budget <input name="target_budget" type="number" min="0" max="9999999999.99" step="0.01"></label>
            <div class="buttons"><button id="save-entry">Add item</button><button type="button" id="cancel-edit" class="secondary" hidden>Cancel</button></div>
          </form>
        </section>

        <section aria-labelledby="entries-title">
          <h2 id="entries-title">Wishlist entries</h2>
          <form id="filters">
            <label>Search title <input name="search" type="search" maxlength="150"></label>
            <label>Category <input name="category" maxlength="100"></label>
            <label>Priority <select name="priority"><option value="">Any priority</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label>
            <label>Status <select name="status"><option value="">Any status</option><option value="wanted">Wanted</option><option value="acquired">Acquired</option></select></label>
            <label>Maximum budget <input name="max_budget" type="number" min="0" max="9999999999.99" step="0.01"></label>
            <div class="buttons"><button>Apply filters</button><button id="clear-filters" type="button" class="secondary">Clear</button></div>
          </form>
          <div id="entries"></div>
        </section>

        <section aria-labelledby="planner-title">
          <h2 id="planner-title">Purchase budget planner</h2>
          <p>See which wanted items fit your spending limit, starting with the highest priority.</p>
          <form id="planner">
            <label>Spending limit <input name="limit" type="number" min="0" max="9999999999.99" step="0.01" required></label>
            <button>Build plan</button>
          </form>
          <div id="plan-result" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
